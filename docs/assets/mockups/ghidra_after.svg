<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .title-bar { fill: #3c3f41; }
      .window-bg { fill: #2b2b2b; }
      .panel-bg { fill: #313335; }
      .text-normal { fill: #a9b7c6; font-size: 11px; }
      .text-keyword { fill: #cc7832; font-size: 11px; }
      .text-type { fill: #6897bb; font-size: 11px; }
      .text-number { fill: #6897bb; font-size: 11px; }
      .text-string { fill: #6a8759; font-size: 11px; }
      .text-comment { fill: #808080; font-size: 11px; }
      .text-func { fill: #ffc66d; font-size: 11px; }
      .text-title { fill: #bbbbbb; font-size: 12px; }
      .text-menu { fill: #bbbbbb; font-size: 11px; }
      .line-num { fill: #606366; font-size: 11px; }
      .func-list-item { fill: #a9b7c6; font-size: 10px; }
      .func-list-selected { fill: #214283; }
      .separator { stroke: #555555; stroke-width: 1; }
