  <rect x="8" y="56" width="16" height="16" rx="2" fill="#4b6eaf" opacity="0.6"/>
  <rect x="28" y="56" width="16" height="16" rx="2" fill="#4b6eaf" opacity="0.6"/>
  <rect x="48" y="56" width="16" height="16" rx="2" fill="#4b6eaf" opacity="0.6"/>
  <line x1="0" y1="76" x2="800" y2="76" class="separator"/>

  <!-- Left panel: Function List -->
  <rect x="0" y="76" width="170" height="524" class="panel-bg"/>
  <rect x="0" y="76" width="170" height="20" fill="#3c3f41"/>
