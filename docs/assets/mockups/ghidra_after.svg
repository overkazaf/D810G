  <text x="680" y="91" class="mono" style="fill:#4caf50; font-size:9px;">D810G Cleaned</text>

  <!-- Code area - clean code -->
  <rect x="170" y="96" width="630" height="320" class="window-bg"/>

  <!-- Clean decompiled code -->
  <!-- Line 1: function signature -->
  <text x="180" y="116" class="mono line-num">1</text>
  <text x="205" y="116" class="mono text-keyword">int</text>
  <text x="228" y="116" class="mono text-func">check_license</text>
  <text x="318" y="116" class="mono text-normal">(</text>
  <text x="325" y="116" class="mono text-keyword">char</text>
  <text x="355" y="116" class="mono text-normal">*param_1) {</text>

  <!-- Line 2: sum -->
  <text x="180" y="136" class="mono line-num">2</text>
  <text x="225" y="136" class="mono text-keyword">int</text>
  <text x="248" y="136" class="mono text-normal">sum =</text>
  <text x="285" y="136" class="mono text-number">0</text>
  <text x="292" y="136" class="mono text-normal">;</text>

  <!-- Line 3: i -->
  <text x="180" y="156" class="mono line-num">3</text>
  <text x="225" y="156" class="mono text-keyword">int</text>
  <text x="248" y="156" class="mono text-normal">i =</text>
  <text x="272" y="156" class="mono text-number">0</text>
  <text x="279" y="156" class="mono text-normal">;</text>

  <!-- Line 4: blank -->
  <text x="180" y="176" class="mono line-num">4</text>

  <!-- Line 5: while -->
  <text x="180" y="196" class="mono line-num">5</text>
  <text x="225" y="196" class="mono text-keyword">while</text>
  <text x="258" y="196" class="mono text-normal">(*(param_1 + i) !=</text>
  <text x="392" y="196" class="mono text-string">'\0'</text>
  <text x="420" y="196" class="mono text-normal">) {</text>

  <!-- Line 6: sum += -->
  <text x="180" y="216" class="mono line-num">6</text>
  <text x="245" y="216" class="mono text-normal">sum = sum + *(param_1 + i);</text>

  <!-- Line 7: i++ -->
  <text x="180" y="236" class="mono line-num">7</text>
  <text x="245" y="236" class="mono text-normal">i = i +</text>
  <text x="302" y="236" class="mono text-number">1</text>
  <text x="309" y="236" class="mono text-normal">;</text>

  <!-- Line 8: close while -->
  <text x="180" y="256" class="mono line-num">8</text>
  <text x="225" y="256" class="mono text-normal">}</text>

  <!-- Line 9: if -->
  <text x="180" y="276" class="mono line-num">9</text>
  <text x="225" y="276" class="mono text-keyword">if</text>
  <text x="242" y="276" class="mono text-normal">(sum ==</text>
  <text x="298" y="276" class="mono text-number">0x1a4</text>
  <text x="331" y="276" class="mono text-normal">) {</text>

  <!-- Line 10: return 1 -->
  <text x="175" y="296" class="mono line-num">10</text>
  <text x="245" y="296" class="mono text-keyword">return</text>
  <text x="285" y="296" class="mono text-number">1</text>
  <text x="292" y="296" class="mono text-normal">;</text>

  <!-- Line 11: close if -->
  <text x="175" y="316" class="mono line-num">11</text>
  <text x="225" y="316" class="mono text-normal">}</text>

  <!-- Line 12: return 0 -->
  <text x="175" y="336" class="mono line-num">12</text>
  <text x="225" y="336" class="mono text-keyword">return</text>
  <text x="265" y="336" class="mono text-number">0</text>
  <text x="272" y="336" class="mono text-normal">;</text>

  <!-- Line 13: close function -->
  <text x="175" y="356" class="mono line-num">13</text>
  <text x="205" y="356" class="mono text-normal">}</text>

  <!-- Separator between code and results panel -->
  <line x1="170" y1="416" x2="800" y2="416" class="separator"/>

  <!-- D810G Results panel -->
  <rect x="170" y="416" width="630" height="20" fill="#3c3f41"/>
  <text x="178" y="430" class="mono" style="fill:#ffc66d; font-size:10px;">D810G Results</text>

  <rect x="170" y="436" width="630" height="150" fill="#1e1e1e"/>

