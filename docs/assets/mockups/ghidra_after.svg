  <text x="180" y="454" class="mono log-label">[D810G]</text>
  <text x="228" y="454" class="mono log-text">Deobfuscated</text>
  <text x="320" y="454" class="mono" style="fill:#ffc66d; font-size:10px;">check_license</text>
  <text x="420" y="454" class="mono log-text">: deobfuscated (</text>
  <text x="555" y="454" class="mono" style="fill:#6897bb; font-size:10px;">5</text>
  <text x="565" y="454" class="mono log-text">patches applied)</text>

  <text x="180" y="474" class="mono log-label">[D810G]</text>
  <text x="228" y="474" class="mono log-text">CFF pattern detected:</text>
  <text x="395" y="474" class="mono" style="fill:#cc7832; font-size:10px;">ollvm_switch</text>
  <text x="490" y="474" class="mono log-text">(dispatcher at 0x401000, 5 case blocks)</text>

  <text x="180" y="494" class="mono log-label">[D810G]</text>
  <text x="228" y="494" class="mono log-text">State transitions recovered via Unicorn emulation</text>

  <text x="180" y="514" class="mono log-label">[D810G]</text>
  <text x="228" y="514" class="mono log-info">2 opaque predicates eliminated</text>
  <text x="450" y="514" class="mono log-text">(always_true: 1, always_false: 1)</text>

  <text x="180" y="534" class="mono log-label">[D810G]</text>
  <text x="228" y="534" class="mono log-info">1 dead code block removed</text>
  <text x="410" y="534" class="mono log-text">(48 bytes)</text>

  <!-- Completion indicator -->
  <rect x="180" y="548" width="600" height="16" rx="3" fill="#4caf50" opacity="0.1"/>
  <text x="190" y="560" class="mono" style="fill:#4caf50; font-size:10px;">Deobfuscation complete. Function reduced from 23 blocks to 5 blocks (78% reduction).</text>

  <!-- Status bar -->
  <rect x="0" y="586" width="800" height="14" rx="0" fill="#3c3f41"/>
  <text x="8" y="596" class="mono" style="fill:#808080; font-size:9px;">check_license @ 00401000 | x86_64 | 156 bytes | 5 basic blocks | D810G: cleaned</text>

  <!-- Window border -->
  <rect width="800" height="600" rx="6" ry="6" fill="none" stroke="#555555" stroke-width="1"/>
</svg>