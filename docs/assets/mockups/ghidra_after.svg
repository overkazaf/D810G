  <circle cx="58" cy="15" r="6" class="btn-max"/>
  <text x="400" y="19" text-anchor="middle" class="mono text-title">CodeBrowser: test_target [x86_64/gcc]</text>

  <!-- Menu bar -->
  <rect x="0" y="30" width="800" height="22" fill="#3c3f41"/>
  <text x="12" y="45" class="mono text-menu">File</text>
  <text x="50" y="45" class="mono text-menu">Edit</text>
  <text x="90" y="45" class="mono text-menu">Analysis</text>
  <text x="155" y="45" class="mono text-menu">Navigation</text>
  <text x="235" y="45" class="mono text-menu">Search</text>
  <text x="290" y="45" class="mono text-menu">Window</text>
