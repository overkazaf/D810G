  <text x="22" y="126" class="mono func-list-item">main</text>
  <text x="22" y="140" class="mono func-list-item">init_config</text>
  <rect x="4" y="143" width="162" height="14" class="func-list-selected" rx="2"/>
  <text x="22" y="154" class="mono" style="fill:#ffffff; font-size:10px;">check_license</text>
  <text x="22" y="168" class="mono func-list-item">validate_key</text>
  <text x="22" y="182" class="mono func-list-item">decrypt_string</text>
