<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .window-bg { fill: #2b2b2b; }
      .title-bar { fill: #3c3f41; }
      .text-normal { fill: #a9b7c6; font-size: 10px; }
      .text-keyword { fill: #cc7832; font-size: 10px; }
      .text-number { fill: #6897bb; font-size: 10px; }
      .text-string { fill: #6a8759; font-size: 10px; }
      .text-func { fill: #ffc66d; font-size: 10px; }
      .text-comment { fill: #808080; font-size: 10px; }
      .line-num { fill: #606366; font-size: 10px; }
      .separator { stroke: #555555; stroke-width: 1; }
      .btn-close { fill: #c75050; }
      .btn-min { fill: #d4a017; }
      .btn-max { fill: #4caf50; }
      .label-before { fill: #c75050; }
      .label-after { fill: #4caf50; }
      .arrow-text { fill: #ffc66d; font-size: 16px; font-weight: bold; }
    </style>
  </defs>

  <!-- Overall background -->
  <rect width="1000" height="450" rx="8" fill="#1e1e1e"/>

  <!-- ============ LEFT PANEL: BEFORE ============ -->
  <g transform="translate(20, 20)">
    <!-- Label -->
    <rect x="0" y="0" width="420" height="26" rx="4" fill="#c75050" opacity="0.15"/>
    <text x="210" y="17" text-anchor="middle" class="sans" style="fill:#c75050; font-size:13px; font-weight:bold;">Before D810G</text>

    <!-- Window -->
    <rect x="0" y="32" width="420" height="390" rx="5" class="window-bg"/>

    <!-- Title bar -->
    <rect x="0" y="32" width="420" height="24" rx="5" class="title-bar"/>
    <rect x="0" y="48" width="420" height="8" class="title-bar"/>
    <circle cx="14" cy="44" r="4.5" class="btn-close"/>
    <circle cx="28" cy="44" r="4.5" class="btn-min"/>
    <circle cx="42" cy="44" r="4.5" class="btn-max"/>
    <text x="210" y="48" text-anchor="middle" class="mono" style="fill:#bbbbbb; font-size:9px;">Decompiler: check_license</text>

    <!-- Code area -->
    <rect x="0" y="56" width="420" height="366" fill="#2b2b2b"/>

    <!-- Obfuscated code -->
    <text x="8" y="74" class="mono line-num">1</text>
    <text x="28" y="74" class="mono text-keyword">int</text>
    <text x="48" y="74" class="mono text-func">check_license</text>
    <text x="128" y="74" class="mono text-normal">(</text>
    <text x="134" y="74" class="mono text-keyword">char</text>
    <text x="160" y="74" class="mono text-normal">*param_1) {</text>

    <text x="8" y="90" class="mono line-num">2</text>
    <text x="40" y="90" class="mono text-keyword">int</text>
    <text x="60" y="90" class="mono text-normal">local_10 =</text>
    <text x="130" y="90" class="mono text-number">0x2b8a7c3f</text>
    <text x="198" y="90" class="mono text-normal">;</text>

    <text x="8" y="106" class="mono line-num">3</text>
    <text x="40" y="106" class="mono text-keyword">int</text>
    <text x="60" y="106" class="mono text-normal">local_1c =</text>
    <text x="130" y="106" class="mono text-number">0</text>
    <text x="137" y="106" class="mono text-normal">;</text>

    <text x="8" y="122" class="mono line-num">4</text>
    <text x="40" y="122" class="mono text-keyword">int</text>
    <text x="60" y="122" class="mono text-normal">local_18 =</text>
    <text x="130" y="122" class="mono text-number">0</text>
    <text x="137" y="122" class="mono text-normal">;</text>

    <text x="8" y="138" class="mono line-num">5</text>

    <text x="8" y="154" class="mono line-num">6</text>
    <text x="40" y="154" class="mono text-keyword">while</text>
    <text x="70" y="154" class="mono text-normal">(</text>
    <text x="76" y="154" class="mono text-keyword">true</text>
    <text x="100" y="154" class="mono text-normal">) {</text>

    <text x="8" y="170" class="mono line-num">7</text>
    <text x="56" y="170" class="mono text-keyword">switch</text>
    <text x="92" y="170" class="mono text-normal">(local_10) {</text>

    <text x="8" y="186" class="mono line-num">8</text>
    <text x="72" y="186" class="mono text-keyword">case</text>
    <text x="100" y="186" class="mono text-number">0x2b8a7c3f</text>
    <text x="168" y="186" class="mono text-normal">:</text>

    <text x="8" y="202" class="mono line-num">9</text>
    <text x="88" y="202" class="mono text-keyword">if</text>
    <text x="102" y="202" class="mono text-normal">(*(param_1+local_18)==</text>
    <text x="248" y="202" class="mono text-number">0</text>
    <text x="254" y="202" class="mono text-normal">)</text>

    <text x="4" y="218" class="mono line-num">10</text>
    <text x="104" y="218" class="mono text-normal">local_10 =</text>
    <text x="174" y="218" class="mono text-number">0x7d3e9a15</text>
    <text x="242" y="218" class="mono text-normal">;</text>

    <text x="4" y="234" class="mono line-num">11</text>
    <text x="88" y="234" class="mono text-keyword">else</text>

    <text x="4" y="250" class="mono line-num">12</text>
    <text x="104" y="250" class="mono text-normal">local_10 =</text>
    <text x="174" y="250" class="mono text-number">0x4f1c82d6</text>
    <text x="242" y="250" class="mono text-normal">;</text>

    <text x="4" y="266" class="mono line-num">13</text>
    <text x="88" y="266" class="mono text-keyword">break</text>
    <text x="118" y="266" class="mono text-normal">;</text>

    <text x="4" y="282" class="mono line-num">14</text>
    <text x="72" y="282" class="mono text-keyword">case</text>
    <text x="100" y="282" class="mono text-number">0x4f1c82d6</text>
    <text x="168" y="282" class="mono text-normal">:</text>

    <text x="4" y="298" class="mono line-num">15</text>
    <text x="88" y="298" class="mono text-normal">local_1c = local_1c +</text>

    <text x="4" y="314" class="mono line-num">16</text>
    <text x="104" y="314" class="mono text-normal">*(param_1 + local_18);</text>

    <text x="4" y="330" class="mono line-num">17</text>
    <text x="88" y="330" class="mono text-normal">local_18 = local_18 +</text>
    <text x="240" y="330" class="mono text-number">1</text>
    <text x="246" y="330" class="mono text-normal">;</text>

    <text x="4" y="346" class="mono line-num">18</text>
    <text x="88" y="346" class="mono text-normal">local_10 =</text>
    <text x="158" y="346" class="mono text-number">0x2b8a7c3f</text>
    <text x="226" y="346" class="mono text-normal">;</text>

    <text x="4" y="362" class="mono line-num">19</text>
    <text x="88" y="362" class="mono text-keyword">break</text>
    <text x="118" y="362" class="mono text-normal">;</text>

    <text x="4" y="378" class="mono line-num">20</text>
    <text x="72" y="378" class="mono text-keyword">case</text>
    <text x="100" y="378" class="mono text-number">0x7d3e9a15</text>
    <text x="168" y="378" class="mono text-normal">:</text>

    <text x="4" y="394" class="mono line-num">21</text>
    <text x="88" y="394" class="mono text-comment">... (23 blocks, 847 bytes)</text>

    <!-- Window border -->
    <rect x="0" y="32" width="420" height="390" rx="5" fill="none" stroke="#555555" stroke-width="1"/>

    <!-- Stats bar -->
    <rect x="0" y="402" width="420" height="20" rx="0" fill="#3c3f41"/>
    <rect x="0" y="412" width="420" height="10" rx="5" fill="#3c3f41"/>
    <text x="8" y="415" class="mono" style="fill:#c75050; font-size:9px;">23 basic blocks | 847 bytes | state machine dispatch</text>
  </g>

  <!-- ============ CENTER: ARROW ============ -->
  <g transform="translate(460, 180)">
    <!-- Arrow body -->
    <rect x="0" y="20" width="80" height="4" rx="2" fill="#ffc66d"/>
    <!-- Arrowhead -->
    <polygon points="80,10 80,34 98,22" fill="#ffc66d"/>

    <!-- D810G label -->
    <text x="49" y="12" text-anchor="middle" class="mono arrow-text">D810G</text>

    <!-- Stats under arrow -->
    <text x="49" y="58" text-anchor="middle" class="mono" style="fill:#808080; font-size:9px;">5 patches</text>
    <text x="49" y="72" text-anchor="middle" class="mono" style="fill:#808080; font-size:9px;">78% reduction</text>
  </g>

  <!-- ============ RIGHT PANEL: AFTER ============ -->
  <g transform="translate(560, 20)">
    <!-- Label -->
    <rect x="0" y="0" width="420" height="26" rx="4" fill="#4caf50" opacity="0.15"/>
    <text x="210" y="17" text-anchor="middle" class="sans" style="fill:#4caf50; font-size:13px; font-weight:bold;">After D810G</text>

    <!-- Window -->
    <rect x="0" y="32" width="420" height="390" rx="5" class="window-bg"/>

    <!-- Title bar -->
    <rect x="0" y="32" width="420" height="24" rx="5" class="title-bar"/>
    <rect x="0" y="48" width="420" height="8" class="title-bar"/>
    <circle cx="14" cy="44" r="4.5" class="btn-close"/>
    <circle cx="28" cy="44" r="4.5" class="btn-min"/>
    <circle cx="42" cy="44" r="4.5" class="btn-max"/>
    <text x="210" y="48" text-anchor="middle" class="mono" style="fill:#bbbbbb; font-size:9px;">Decompiler: check_license</text>

    <!-- Code area -->
    <rect x="0" y="56" width="420" height="366" fill="#2b2b2b"/>

    <!-- Clean decompiled code -->
    <text x="8" y="80" class="mono line-num">1</text>
    <text x="28" y="80" class="mono text-keyword">int</text>
    <text x="48" y="80" class="mono text-func">check_license</text>
    <text x="128" y="80" class="mono text-normal">(</text>
    <text x="134" y="80" class="mono text-keyword">char</text>
    <text x="160" y="80" class="mono text-normal">*param_1) {</text>

    <text x="8" y="100" class="mono line-num">2</text>
    <text x="40" y="100" class="mono text-keyword">int</text>
    <text x="60" y="100" class="mono text-normal">sum =</text>
    <text x="92" y="100" class="mono text-number">0</text>
    <text x="99" y="100" class="mono text-normal">;</text>

    <text x="8" y="120" class="mono line-num">3</text>
    <text x="40" y="120" class="mono text-keyword">int</text>
    <text x="60" y="120" class="mono text-normal">i =</text>
    <text x="80" y="120" class="mono text-number">0</text>
    <text x="87" y="120" class="mono text-normal">;</text>

    <text x="8" y="140" class="mono line-num">4</text>

    <text x="8" y="160" class="mono line-num">5</text>
    <text x="40" y="160" class="mono text-keyword">while</text>
    <text x="70" y="160" class="mono text-normal">(*(param_1 + i) !=</text>
    <text x="196" y="160" class="mono text-string">'\0'</text>
    <text x="222" y="160" class="mono text-normal">) {</text>

    <text x="8" y="180" class="mono line-num">6</text>
    <text x="56" y="180" class="mono text-normal">sum = sum + *(param_1 + i);</text>

    <text x="8" y="200" class="mono line-num">7</text>
    <text x="56" y="200" class="mono text-normal">i = i +</text>
    <text x="108" y="200" class="mono text-number">1</text>
    <text x="115" y="200" class="mono text-normal">;</text>

    <text x="8" y="220" class="mono line-num">8</text>
    <text x="40" y="220" class="mono text-normal">}</text>

    <text x="8" y="240" class="mono line-num">9</text>
    <text x="40" y="240" class="mono text-keyword">if</text>
    <text x="56" y="240" class="mono text-normal">(sum ==</text>
    <text x="108" y="240" class="mono text-number">0x1a4</text>
    <text x="140" y="240" class="mono text-normal">) {</text>

    <text x="4" y="260" class="mono line-num">10</text>
    <text x="56" y="260" class="mono text-keyword">return</text>
    <text x="92" y="260" class="mono text-number">1</text>
    <text x="99" y="260" class="mono text-normal">;</text>

    <text x="4" y="280" class="mono line-num">11</text>
    <text x="40" y="280" class="mono text-normal">}</text>

    <text x="4" y="300" class="mono line-num">12</text>
    <text x="40" y="300" class="mono text-keyword">return</text>
    <text x="76" y="300" class="mono text-number">0</text>
    <text x="83" y="300" class="mono text-normal">;</text>

    <text x="4" y="320" class="mono line-num">13</text>
    <text x="28" y="320" class="mono text-normal">}</text>

    <!-- Visual whitespace, clean and readable -->
    <text x="4" y="350" class="mono text-comment" style="font-size:9px;">  // Clean control flow recovered by D810G</text>
    <text x="4" y="364" class="mono text-comment" style="font-size:9px;">  // Sum of ASCII values compared to 0x1a4 (420)</text>
    <text x="4" y="378" class="mono text-comment" style="font-size:9px;">  // Simple license check: sum(chars) == 420</text>

    <!-- Window border -->
    <rect x="0" y="32" width="420" height="390" rx="5" fill="none" stroke="#555555" stroke-width="1"/>

    <!-- Stats bar -->
    <rect x="0" y="402" width="420" height="20" rx="0" fill="#3c3f41"/>
    <rect x="0" y="412" width="420" height="10" rx="5" fill="#3c3f41"/>
    <text x="8" y="415" class="mono" style="fill:#4caf50; font-size:9px;">5 basic blocks | 156 bytes | clean control flow</text>
  </g>

  <!-- Outer border -->
  <rect width="1000" height="450" rx="8" fill="none" stroke="#333333" stroke-width="1"/>
</svg>