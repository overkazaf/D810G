<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#565f89"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0af68"/>
    </marker>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="820" height="220" rx="10" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0caf5">Deobfuscation Pipeline (6-pass fixpoint iteration)</text>

  <!-- Pass boxes - evenly spaced -->
  <!-- Pass 1: deflat_ollvm -->
  <rect x="30" y="60" width="105" height="52" rx="6" fill="#24283b" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="82" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#7aa2f7">Pass 1</text>
  <text x="82" y="100" text-anchor="middle" font-size="10" fill="#c0caf5">deflat_ollvm</text>

  <!-- Arrow -->
  <line x1="135" y1="86" x2="155" y2="86" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Pass 2: deflat_tigress -->
  <rect x="155" y="60" width="105" height="52" rx="6" fill="#24283b" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="207" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#7aa2f7">Pass 2</text>
  <text x="207" y="100" text-anchor="middle" font-size="10" fill="#c0caf5">deflat_tigress</text>

  <!-- Arrow -->
  <line x1="260" y1="86" x2="280" y2="86" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Pass 3: bcf -->
  <rect x="280" y="60" width="105" height="52" rx="6" fill="#24283b" stroke="#e0af68" stroke-width="1.5"/>
  <text x="332" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#e0af68">Pass 3</text>
  <text x="332" y="100" text-anchor="middle" font-size="10" fill="#c0caf5">bcf</text>

  <!-- Arrow -->
  <line x1="385" y1="86" x2="405" y2="86" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Pass 4: opaque -->
  <rect x="405" y="60" width="105" height="52" rx="6" fill="#24283b" stroke="#e0af68" stroke-width="1.5"/>
  <text x="457" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#e0af68">Pass 4</text>
  <text x="457" y="100" text-anchor="middle" font-size="10" fill="#c0caf5">opaque</text>

  <!-- Arrow -->
  <line x1="510" y1="86" x2="530" y2="86" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Pass 5: dce -->
  <rect x="530" y="60" width="105" height="52" rx="6" fill="#24283b" stroke="#bb9af7" stroke-width="1.5"/>
  <text x="582" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#bb9af7">Pass 5</text>
  <text x="582" y="100" text-anchor="middle" font-size="10" fill="#c0caf5">dce</text>

  <!-- Arrow -->
  <line x1="635" y1="86" x2="655" y2="86" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Pass 6: strings -->
  <rect x="655" y="60" width="105" height="52" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1.5"/>
  <text x="707" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#9ece6a">Pass 6</text>
  <text x="707" y="100" text-anchor="middle" font-size="10" fill="#c0caf5">strings</text>

  <!-- Arrow down from strings to decision -->
  <line x1="707" y1="112" x2="707" y2="140" stroke="#565f89" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Decision diamond -->
  <polygon points="707,140 745,162 707,184 669,162" fill="#24283b" stroke="#ff9e64" stroke-width="1.5"/>
  <text x="707" y="166" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff9e64">changes?</text>

  <!-- "yes" loop back arrow -->
  <line x1="669" y1="162" x2="30" y2="162" stroke="#e0af68" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="30" y1="162" x2="30" y2="120" stroke="#e0af68" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="30" y1="120" x2="30" y2="112" stroke="#e0af68" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="350" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#e0af68">yes - iterate</text>

  <!-- "no" arrow to Done -->
  <line x1="745" y1="162" x2="770" y2="162" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="770" y="148" width="40" height="28" rx="14" fill="#9ece6a" opacity="0.2" stroke="#9ece6a" stroke-width="1.5"/>
  <text x="790" y="167" text-anchor="middle" font-size="11" font-weight="bold" fill="#9ece6a">Done</text>

  <!-- no label -->
  <text x="758" y="156" text-anchor="middle" font-size="9" fill="#9ece6a">no</text>

  <!-- Bottom annotation -->
  <text x="410" y="208" text-anchor="middle" font-size="10" fill="#565f89">Fixpoint: repeats all 6 passes until no further modifications are made</text>
</svg>